<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DailyQT - 시작하기</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6C63FF;
    --primary-light: #8B83FF;
    --primary-bg: #F0EEFF;
    --success: #4CAF50;
    --text: #2D2D3A;
    --text-light: #6B6B80;
    --bg: #FAFAFE;
    --card: #FFFFFF;
    --border: #E8E8F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  #app {
    max-width: 520px; width: 100%; margin: 0 auto;
    padding: 60px 20px 40px;
    min-height: 100vh;
  }
  .progress-bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--border); z-index: 100; }
  .progress-fill { height: 100%; background: var(--primary); transition: width 0.4s ease; }

  .card {
    background: var(--card); border-radius: 20px; padding: 32px 24px;
    box-shadow: 0 2px 12px rgba(108,99,255,0.08);
    animation: slideUp 0.35s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .title { font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 8px; }
  .desc { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
  .step-num { text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 10px; }

  .text-input {
    width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 16px; font-family: inherit; outline: none; transition: border-color 0.2s;
    -webkit-appearance: none; appearance: none;
  }
  .text-input:focus { border-color: var(--primary); }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    display: block; padding: 14px 16px;
    border: 2px solid var(--border); border-radius: 14px; background: var(--card);
    cursor: pointer; transition: all 0.15s; font-size: 15px; text-align: left;
    font-family: inherit; width: 100%; color: var(--text);
  }
  .choice:active { transform: scale(0.98); }
  .choice.on { border-color: var(--primary); background: var(--primary-bg); font-weight: 600; }
  .choice-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; font-weight: 400; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border: 2px solid var(--border); border-radius: 10px;
    font-size: 13px; cursor: pointer; background: var(--card); font-family: inherit;
    color: var(--text); transition: all 0.15s;
  }
  .chip:active { transform: scale(0.96); }
  .chip.on { border-color: var(--primary); background: var(--primary-bg); font-weight: 600; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
  .btn-back { background: none; border: none; color: var(--text-light); font-size: 15px; cursor: pointer; padding: 10px 16px; font-family: inherit; }
  .btn {
    padding: 14px 36px; background: var(--primary); color: white; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-ghost {
    padding: 14px 36px; background: none; color: var(--text-light); border: 2px solid var(--border);
    border-radius: 12px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .btn-full { width: 100%; padding: 16px; background: var(--primary); color: white; border: none;
    border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .scale-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .scale-btn {
    width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--card); font-size: 18px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    font-family: inherit; color: var(--text);
  }
  .scale-btn:active { transform: scale(0.95); }
  .scale-btn.on { border-color: var(--primary); background: var(--primary); color: white; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); }

  .result-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
  .result-title { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .result-desc { text-align: center; font-size: 14px; color: var(--text-light); margin-bottom: 24px; line-height: 1.6; }
  .pathway { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--primary-bg); border-radius: 14px; margin-bottom: 8px; }
  .pathway-score { font-size: 22px; font-weight: 700; color: var(--primary); min-width: 44px; text-align: center; }
  .pathway-name { font-size: 14px; font-weight: 600; }
  .pathway-sub { font-size: 12px; color: var(--text-light); }

  .field-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .field-group { margin-bottom: 16px; }
</style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
<div id="app"></div>

<script>
const S = {
  step: 0,
  nickname: '',
  maturity: '',
  personal: {},
  quiz: null,
  answers: {},
  qi: 0,
  result: null,
};

const STEPS = 5;
let quizData = null;

// ── Init ──
(async function() {
  try {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.loggedIn) { location.href = '/login.html'; return; }

    const ob = await fetch('/api/v2/onboarding').then(r => r.json()).catch(() => null);
    if (ob && ob.completed) { location.href = '/'; return; }

    quizData = await fetch('/data/temperament-quiz.json').then(r => r.json()).catch(() => null);
  } catch(e) {
    console.error('init error:', e);
  }
  draw();
})();

// ── Draw ──
function draw() {
  const app = document.getElementById('app');
  document.getElementById('bar').style.width = ((S.step + 1) / STEPS * 100) + '%';

  const fn = [drawName, drawMaturity, drawPersonal, drawQuizIntro, drawQuiz, drawResult][S.step];
  if (fn) fn(app);
}

// ── Step 0: 닉네임 ──
function drawName(el) {
  el.innerHTML = `
    <div class="step-num">1 / ${STEPS}</div>
    <div class="card">
      <div class="title">반갑습니다!</div>
      <div class="desc">DailyQT에서 사용할 이름을 알려주세요.</div>
      <form id="nameForm">
        <input class="text-input" id="nameVal" type="text" placeholder="닉네임" maxlength="20" autocomplete="off">
        <div class="nav">
          <div></div>
          <button type="submit" class="btn" id="nameBtn" disabled>다음</button>
        </div>
      </form>
    </div>`;

  var input = document.getElementById('nameVal');
  var btn = document.getElementById('nameBtn');
  var form = document.getElementById('nameForm');

  if (S.nickname) { input.value = S.nickname; btn.disabled = false; }

  input.focus();

  function check() {
    S.nickname = input.value.trim();
    btn.disabled = S.nickname.length === 0;
  }

  input.oninput = check;
  input.onkeyup = check;
  input.onchange = check;
  input.onpaste = function() { setTimeout(check, 0); };

  form.onsubmit = function(e) {
    e.preventDefault();
    S.nickname = input.value.trim();
    if (!S.nickname) return;
    S.step = 1;
    draw();
  };
}

// ── Step 1: 성숙도 ──
function drawMaturity(el) {
  var opts = [
    ['exploring', '처음이에요', '성경을 거의 읽어본 적 없어요'],
    ['growing', '가끔 읽어요', '교회에 다니고 가끔 성경을 읽어요'],
    ['close', '꾸준히 묵상해요', '매일 또는 자주 말씀을 묵상해요'],
    ['centered', '깊이 해왔어요', '수년간 깊이 있는 묵상을 해왔어요'],
  ];
  el.innerHTML = `
    <div class="step-num">2 / ${STEPS}</div>
    <div class="card">
      <div class="title">${S.nickname}님,<br>성경이 얼마나 익숙하신가요?</div>
      <div class="desc">맞춤 묵상을 위해 알려주세요.</div>
      <div class="choices" id="matChoices"></div>
      <div class="nav">
        <button type="button" class="btn-back" id="matBack">이전</button>
        <button type="button" class="btn" id="matNext" disabled>다음</button>
      </div>
    </div>`;

  var box = document.getElementById('matChoices');
  opts.forEach(function(o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice' + (S.maturity === o[0] ? ' on' : '');
    b.innerHTML = '<div>' + o[1] + '<div class="choice-sub">' + o[2] + '</div></div>';
    b.onclick = function() {
      S.maturity = o[0];
      draw();
    };
    box.appendChild(b);
  });

  document.getElementById('matNext').disabled = !S.maturity;
  document.getElementById('matNext').onclick = function() { if (S.maturity) { S.step = 2; draw(); } };
  document.getElementById('matBack').onclick = function() { S.step = 0; draw(); };
}

// ── Step 2: 개인정보 (선택) ──
function drawPersonal(el) {
  var p = S.personal;
  el.innerHTML = `
    <div class="step-num">3 / ${STEPS}</div>
    <div class="card">
      <div class="title">조금 더 알려주시겠어요?</div>
      <div class="desc">선택 사항이에요. 건너뛰셔도 괜찮습니다.</div>

      <div class="field-group">
        <div class="field-label">나이대</div>
        <div class="chip-row" id="ageRow"></div>
      </div>
      <div class="field-group">
        <div class="field-label">결혼 여부</div>
        <div class="chip-row" id="marriageRow"></div>
      </div>
      <div class="field-group">
        <div class="field-label">자녀</div>
        <div class="chip-row" id="childRow"></div>
      </div>
      <div class="field-group">
        <div class="field-label">직업</div>
        <div class="chip-row" id="jobRow"></div>
      </div>
      <div class="field-group">
        <div class="field-label">교회 출석</div>
        <div class="chip-row" id="churchRow"></div>
      </div>

      <div class="nav">
        <button type="button" class="btn-back" id="pBack">이전</button>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn-ghost" id="pSkip">건너뛰기</button>
          <button type="button" class="btn" id="pNext">다음</button>
        </div>
      </div>
    </div>`;

  function chips(containerId, items, key) {
    var row = document.getElementById(containerId);
    items.forEach(function(item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (p[key] === item[0] ? ' on' : '');
      b.textContent = item[1];
      b.onclick = function() { p[key] = item[0]; draw(); };
      row.appendChild(b);
    });
  }

  chips('ageRow', [['10대','10대'],['20대','20대'],['30대','30대'],['40대','40대'],['50대','50대'],['60대+','60대+']], 'age_group');
  chips('marriageRow', [['single','미혼'],['married','기혼'],['divorced','이혼/별거'],['bereaved','사별']], 'marriage_status');
  chips('childRow', [[true,'있음'],[false,'없음']], 'has_children');
  chips('jobRow', [['student','학생'],['employed','직장인'],['self_employed','자영업'],['job_seeking','구직중'],['retired','은퇴'],['other','기타']], 'job_status');
  chips('churchRow', [[true,'출석중'],[false,'안 하고 있음']], 'attends_church');

  document.getElementById('pBack').onclick = function() { S.step = 1; draw(); };
  document.getElementById('pSkip').onclick = doSubmitPersonal;
  document.getElementById('pNext').onclick = doSubmitPersonal;
}

async function doSubmitPersonal() {
  try {
    await fetch('/api/v2/onboarding', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: S.nickname, maturity_level: S.maturity, ...S.personal })
    });
  } catch(e) { console.error(e); }
  S.step = 3;
  draw();
}

// ── Step 3: 기질검사 안내 ──
function drawQuizIntro(el) {
  el.innerHTML = `
    <div class="step-num">4 / ${STEPS}</div>
    <div class="card" style="text-align:center;">
      <div class="result-icon">&#x1F9ED;</div>
      <div class="title">나에게 맞는 묵상 스타일을<br>찾아볼까요?</div>
      <div class="desc">27개의 질문으로 약 3~5분 정도 걸려요.</div>
      <button type="button" class="btn-full" id="quizStart" style="margin-bottom:12px;">검사 시작</button>
      <button type="button" class="btn-ghost" id="quizSkip" style="width:100%;">나중에 할게요</button>
      <div class="nav" style="margin-top:16px;">
        <button type="button" class="btn-back" id="qiBack">이전</button>
        <div></div>
      </div>
    </div>`;

  document.getElementById('quizStart').onclick = function() { S.qi = 0; S.step = 4; draw(); };
  document.getElementById('quizSkip').onclick = function() { S.result = { skipped: true }; S.step = 5; draw(); };
  document.getElementById('qiBack').onclick = function() { S.step = 2; draw(); };
}

// ── Step 4: 기질검사 ──
function drawQuiz(el) {
  if (!quizData || !quizData.questions) { S.step = 5; S.result = { skipped: true }; draw(); return; }
  var q = quizData.questions[S.qi];
  var total = quizData.questions.length;
  var ans = S.answers[q.id];

  el.innerHTML = `
    <div style="height:3px;background:var(--border);border-radius:2px;margin-bottom:24px;">
      <div style="height:100%;background:var(--primary);border-radius:2px;width:${((S.qi+1)/total)*100}%;transition:width 0.3s;"></div>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-light);margin-bottom:16px;">${S.qi+1} / ${total}</div>
      <div style="font-size:17px;font-weight:600;line-height:1.6;margin-bottom:20px;">${q.text}</div>
      <div class="scale-row" id="scaleRow"></div>
      <div class="scale-labels"><span>전혀 아니다</span><span>매우 그렇다</span></div>
      <div class="nav">
        <button type="button" class="btn-back" id="qBack">이전</button>
        <button type="button" class="btn" id="qNext" disabled>${S.qi === total - 1 ? '완료' : '다음'}</button>
      </div>
    </div>`;

  var row = document.getElementById('scaleRow');
  for (var n = 0; n <= 4; n++) {
    (function(val) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'scale-btn' + (ans === val ? ' on' : '');
      b.textContent = val;
      b.onclick = function() { S.answers[q.id] = val; draw(); };
      row.appendChild(b);
    })(n);
  }

  var nextBtn = document.getElementById('qNext');
  nextBtn.disabled = (ans === undefined);
  nextBtn.onclick = function() {
    if (ans === undefined) return;
    if (S.qi < total - 1) { S.qi++; draw(); }
    else { doSubmitQuiz(); }
  };

  document.getElementById('qBack').onclick = function() {
    if (S.qi > 0) { S.qi--; draw(); }
    else { S.step = 3; draw(); }
  };
}

async function doSubmitQuiz() {
  var answers = Object.entries(S.answers).map(function(e) { return { question_id: parseInt(e[0]), score: e[1] }; });
  try {
    var res = await fetch('/api/v2/onboarding/temperament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: answers })
    });
    S.result = await res.json();
  } catch(e) { S.result = { skipped: true }; }
  S.step = 5;
  draw();
}

// ── Step 5: 결과 ──
function drawResult(el) {
  var skipped = !S.result || S.result.skipped;
  var paths = (S.result && S.result.top_pathways) || [];

  var ph = '';
  if (!skipped && paths.length) {
    ph = '<div style="margin-bottom:24px;text-align:left;"><div class="field-label">나의 영적 기질</div>';
    paths.forEach(function(p) {
      ph += '<div class="pathway"><div class="pathway-score">' + p.score + '</div><div><div class="pathway-name">' + p.name + '</div><div class="pathway-sub">' + p.motto + '</div></div></div>';
    });
    ph += '</div>';
  }

  el.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="result-icon">&#x2728;</div>
      <div class="result-title">${S.nickname}님,<br>준비 완료!</div>
      <div class="result-desc">${skipped ? '묵상하면서 점점 더 맞춤화될 거예요.' : '기질에 맞는 묵상이 매일 준비됩니다.'}</div>
      ${ph}
      <button type="button" class="btn-full" id="startBtn">묵상 시작하기</button>
    </div>`;

  document.getElementById('startBtn').onclick = function() { location.href = '/'; };
}
</script>
</body>
</html>
