<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyQT - 나만의 묵상 여정 시작하기</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6C63FF;
    --primary-light: #8B83FF;
    --primary-bg: #F0EEFF;
    --success: #4CAF50;
    --text: #2D2D3A;
    --text-light: #6B6B80;
    --bg: #FAFAFE;
    --card: #FFFFFF;
    --border: #E8E8F0;
    --shadow: 0 2px 12px rgba(108,99,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Progress bar */
  .progress-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 4px; background: var(--border); z-index: 100;
  }
  .progress-fill {
    height: 100%; background: var(--primary);
    transition: width 0.4s ease;
  }

  /* Container */
  .onboarding-container {
    max-width: 520px; width: 100%;
    padding: 60px 24px 40px;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  /* Step counter */
  .step-counter {
    text-align: center; color: var(--text-light);
    font-size: 14px; margin-bottom: 8px;
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: var(--shadow);
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-40px); }
  }
  .question-icon {
    width: 48px; height: 48px;
    background: var(--primary-bg);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    font-size: 24px;
  }
  .question-icon svg { width: 28px; height: 28px; fill: var(--primary); }
  .question-subtitle {
    font-size: 13px; color: var(--primary);
    margin-bottom: 8px; font-weight: 500;
  }
  .question-text {
    font-size: 20px; font-weight: 700;
    line-height: 1.5; margin-bottom: 28px;
  }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 15px; color: var(--text);
    text-align: left;
  }
  .choice-btn:hover { border-color: var(--primary-light); background: var(--primary-bg); }
  .choice-btn.selected {
    border-color: var(--primary);
    background: var(--primary-bg);
    font-weight: 600;
  }
  .choice-icon {
    width: 36px; height: 36px;
    background: var(--primary-bg);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .choice-btn.selected .choice-icon { background: var(--primary); }
  .choice-icon svg { width: 20px; height: 20px; fill: var(--primary); }
  .choice-btn.selected .choice-icon svg { fill: white; }

  /* Next button */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 24px;
  }
  .btn-back {
    background: none; border: none; color: var(--text-light);
    font-size: 15px; cursor: pointer; padding: 10px 16px;
  }
  .btn-back:hover { color: var(--text); }
  .btn-next {
    padding: 14px 36px;
    background: var(--primary);
    color: white; border: none;
    border-radius: 12px;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.4; pointer-events: none;
  }
  .btn-next.active { opacity: 1; pointer-events: auto; }
  .btn-next:hover { background: var(--primary-light); transform: translateY(-1px); }

  /* Topic selection step */
  .topic-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .topic-category-title {
    font-size: 14px; font-weight: 600; color: var(--text-light);
    margin: 16px 0 8px; width: 100%;
  }
  .topic-chip {
    padding: 8px 16px;
    border: 2px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--card);
  }
  .topic-chip:hover { border-color: var(--primary-light); }
  .topic-chip.selected { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); font-weight: 600; }

  /* Style selection step */
  .style-options { display: flex; flex-direction: column; gap: 12px; }
  .style-option {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .style-option:hover { border-color: var(--primary-light); }
  .style-option.selected { border-color: var(--primary); background: var(--primary-bg); }
  .style-label { font-size: 15px; }
  .style-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  /* Result page */
  .result-card {
    text-align: center;
    animation: slideUp 0.5s ease;
  }
  .result-badge {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--primary-bg);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 56px;
  }
  .result-badge svg { width: 64px; height: 64px; fill: var(--primary); }
  .result-level { font-size: 14px; color: var(--primary); font-weight: 600; margin-bottom: 8px; }
  .result-title { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  .result-desc { font-size: 15px; color: var(--text-light); line-height: 1.6; margin-bottom: 32px; }

  /* Plan preview */
  .plan-preview {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    text-align: left;
    margin-bottom: 24px;
  }
  .plan-preview h3 { font-size: 18px; margin-bottom: 16px; }
  .plan-day {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .plan-day:last-child { border-bottom: none; }
  .plan-day-num {
    background: var(--primary-bg); color: var(--primary);
    border-radius: 8px; padding: 4px 10px;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .plan-day-passage { font-weight: 600; }
  .plan-day-focus { color: var(--text-light); font-size: 13px; margin-top: 2px; }

  .btn-start {
    width: 100%; padding: 16px;
    background: var(--primary); color: white;
    border: none; border-radius: 14px;
    font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-start:hover { background: var(--primary-light); }

  /* Test skip button */
  .btn-test-skip {
    position: fixed; bottom: 16px; right: 16px;
    padding: 8px 16px;
    background: #e0e0e0; color: #666;
    border: 1px solid #ccc; border-radius: 8px;
    font-size: 12px; cursor: pointer; z-index: 999;
    opacity: 0.6; transition: opacity 0.2s;
  }
  .btn-test-skip:hover { opacity: 1; }

  /* Hidden */
  .hidden { display: none !important; }
</style>
</head>
<body>

  mentor: `<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
  shelter: `<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`,
  school: `<svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>`,
  hospital: `<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>`,
  rocket: `<svg viewBox="0 0 24 24"><path d="M9.51 18.65c.14.42.56.69 1 .59 1.91-.42 3.37-1.22 4.5-2.3l-2.83-2.83-2.67 4.54zm-1.5-7.19c-1.08 1.13-1.88 2.59-2.3 4.5-.1.44.17.86.59 1l4.54-2.67-2.83-2.83zM20.11 3.89c-1.06-1.06-5.05-.95-8.36.96L7.93 8.67C6.66 9.07 5.89 9.6 5.3 10.19l-.01.01 8.51 8.51.01-.01c.59-.59 1.12-1.36 1.52-2.63l3.82-3.82c1.91-3.31 2.02-7.3.96-8.36zM15 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>`,
  star: `<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`,
  crown: `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z"/></svg>`,
  cross: `<svg viewBox="0 0 24 24"><path d="M11 2v7H4v4h7v9h2v-9h7V9h-7V2z"/></svg>`,
  sprout: `<svg viewBox="0 0 24 24"><path d="M12 22c4.97 0 9-4.03 9-9-4.97 0-9 4.03-9 9zM3 13c0 4.97 4.03 9 9 9-4.97 0-9-4.03-9-9zm5.25-2.09c.54-.4 1.22-.66 1.95-.66l.04.01.42-.74c.28-.5.55-1.1.66-1.52H9V6h2.5V5H9V4h2.5V3h-1.81L12 1l2.31 2H13v1h2.5v1H13v1h2.5v2h-2.32c.11.42.38 1.02.66 1.52l.42.74.04-.01c.73 0 1.41.26 1.95.66.21-.69.35-1.42.35-2.18C16.6 4.51 14.54 2 12 2S7.4 4.51 7.4 7.73c0 .76.14 1.49.35 2.18z"/></svg>`,
  tree: `<svg viewBox="0 0 24 24"><path d="M11 21h2v-4.2c2.95-.49 5.18-2.99 5.18-6.01 0-.55-.05-1.09-.14-1.61L7.96 10.79c-.09.52-.14 1.06-.14 1.61 0 3.02 2.23 5.52 5.18 6.01V21zm7-16h-2c0-2.21-1.79-4-4-4S8 2.79 8 5H6c0-3.31 2.69-6 6-6s6 2.69 6 6z"/></svg>`,
  fruit: `<svg viewBox="0 0 24 24"><path d="M20 10c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.4 1.06-4.55 2.73-6.02L12 2l5.27 1.98C18.94 5.45 20 7.6 20 10zm-8-5c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>`,
};
function icon(name) { return ICONS[name] || ICONS.star; }

// ============================================================
// State
// ============================================================
let quizData = null;
let topicsData = null;
let curriculaData = null;
let currentStep = 0; // 0-11: quiz, 12: topic select, 13: style, 14: result
let answers = {};
let selectedTopics = [];
let dailyAmount = 'one_chapter';
let parallelReading = true;

// ============================================================
// Load data
// ============================================================
let curriculaExtended = [];

async function init() {
  const [quizRes, topicsRes, curriculaRes, extRes, meRes] = await Promise.all([
    fetch('/data/onboarding-quiz.json').then(r => r.json()),
    fetch('/data/topics-db.json').then(r => r.json()),
    fetch('/data/curricula.json').then(r => r.json()),
    fetch('/data/curricula-extended.json').then(r => r.json()).catch(() => []),
    fetch('/api/me').then(r => r.json()),
  ]);
  curriculaExtended = extRes;
  if (!meRes.loggedIn) { window.location.href = '/login.html'; return; }

  // Check if already onboarded (skip if ?test param)
  if (!new URLSearchParams(window.location.search).has('test')) {
    try {
      const obRes = await fetch('/api/onboarding');
      if (obRes.ok) {
        const profile = await obRes.json();
        if (profile) { window.location.href = '/'; return; }
      }
    } catch (e) { /* continue */ }
  }

  quizData = quizRes;
  topicsData = topicsRes;
  curriculaData = curriculaRes;
  render();
}

// ============================================================
// Render
// ============================================================
function render() {
  const c = document.getElementById('container');
  const totalSteps = 15; // 12 quiz + topic + style + result
  const progress = Math.min((currentStep + 1) / totalSteps * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';

  if (currentStep < 12) {
    renderQuizStep(c, currentStep);
  } else if (currentStep === 12) {
    renderTopicSelect(c);
  } else if (currentStep === 13) {
    renderStyleSelect(c);
  } else {
    renderResult(c);
  }
}

function renderQuizStep(c, idx) {
  const q = quizData.questions[idx];
  c.innerHTML = `
    <div class="step-counter">${idx + 1} / 12</div>
    <div class="question-card">
      <div class="question-icon">${icon(q.icon)}</div>
      ${q.subtitle ? `<div class="question-subtitle">${q.subtitle}</div>` : ''}
      <div class="question-text">${q.text}</div>
      <div class="choices">
        ${q.choices.map(ch => `
          <button class="choice-btn ${answers[q.id] === ch.id ? 'selected' : ''}"
                  onclick="selectAnswer(${q.id}, '${ch.id}', ${ch.score})">
            <div class="choice-icon">${icon(ch.icon)}</div>
            <span>${ch.text}</span>
          </button>
        `).join('')}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-back ${idx === 0 ? 'hidden' : ''}" onclick="prevStep()">이전</button>
      <span></span>
    </div>
  `;
}

function renderTopicSelect(c) {
  const categories = [...new Set(topicsData.map(t => t.category))];
  c.innerHTML = `
    <div class="step-counter">관심 주제 선택</div>
    <div class="question-card">
      <div class="question-icon">${icon('compass')}</div>
      <div class="question-text">어떤 주제로 묵상하고 싶으세요?</div>
      <p style="font-size:14px;color:var(--text-light);margin-bottom:20px;">관심 있는 주제를 여러 개 선택해주세요. 선택한 주제를 바탕으로 맞춤 묵상 플랜을 만들어드려요.</p>
      <div class="topic-grid">
        ${categories.map(cat => `
          <div class="topic-category-title">${cat}</div>
          ${topicsData.filter(t => t.category === cat).map(t => `
            <div class="topic-chip ${selectedTopics.includes(t.topic) ? 'selected' : ''}"
                 onclick="toggleTopic(this.dataset.topic)" data-topic="${t.topic}">${t.topic}</div>
          `).join('')}
        `).join('')}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">이전</button>
      <button class="btn-next ${selectedTopics.length > 0 ? 'active' : ''}" onclick="nextStep()">다음</button>
    </div>
  `;
}

function renderStyleSelect(c) {
  c.innerHTML = `
    <div class="step-counter">묵상 스타일 설정</div>
    <div class="question-card">
      <div class="question-icon">${icon('book')}</div>
      <div class="question-text">하루에 얼마나 읽고 싶나요?</div>
      <div class="style-options" style="margin-bottom:24px;">
        <div class="style-option ${dailyAmount === 'short' ? 'selected' : ''}" onclick="setAmount('short')">
          <div class="choice-icon">${icon('clock')}</div>
          <div><div class="style-label">5-10절 (5분)</div><div class="style-sub">짧지만 깊이 있게</div></div>
        </div>
        <div class="style-option ${dailyAmount === 'one_chapter' ? 'selected' : ''}" onclick="setAmount('one_chapter')">
          <div class="choice-icon">${icon('book')}</div>
          <div><div class="style-label">한 장 (10분)</div><div class="style-sub">가장 일반적인 분량</div></div>
        </div>
        <div class="style-option ${dailyAmount === 'long' ? 'selected' : ''}" onclick="setAmount('long')">
          <div class="choice-icon">${icon('books')}</div>
          <div><div class="style-label">여러 장 (20분+)</div><div class="style-sub">통독과 함께 깊이 있게</div></div>
        </div>
      </div>
      <div class="question-text" style="font-size:18px;">구약/신약을 병행할까요?</div>
      <div class="style-options">
        <div class="style-option ${parallelReading ? 'selected' : ''}" onclick="setParallel(true)">
          <div class="choice-icon">${icon('books')}</div>
          <div><div class="style-label">병행 읽기</div><div class="style-sub">구약과 신약을 함께</div></div>
        </div>
        <div class="style-option ${!parallelReading ? 'selected' : ''}" onclick="setParallel(false)">
          <div class="choice-icon">${icon('book')}</div>
          <div><div class="style-label">한 권씩</div><div class="style-sub">하나에 집중해서</div></div>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">이전</button>
      <button class="btn-next active" onclick="finishOnboarding()">결과 보기</button>
    </div>
  `;
}

function findCurriculum(topicName) {
  // First check original 10 (has 7/14/30 day plans)
  const orig = curriculaData.find(cur =>
    cur.topic.includes(topicName) || topicName.includes(cur.topic)
  );
  if (orig) return { type: 'original', data: orig };

  // Then check extended 129 (has 30-day days array)
  const ext = curriculaExtended.find(c =>
    c.topic === topicName || c.topic.includes(topicName) || topicName.includes(c.topic)
  );
  if (ext) return { type: 'extended', data: ext };

  return null;
}

function renderResult(c) {
  const totalScore = Object.values(answers).reduce((s, a) => s + (a.score || 0), 0);
  const level = quizData.scoring.levels.find(l => totalScore >= l.min && totalScore <= l.max)
    || quizData.scoring.levels[0];

  const levelIcons = { exploring: 'seed', growing: 'sprout', close: 'tree', centered: 'fruit' };
  const levelDescs = {
    exploring: '성경의 세계에 첫 발을 내딛는 설레는 여정이 시작됩니다. 하나님의 사랑을 천천히 발견해보세요.',
    growing: '말씀에 대한 열정이 싹트고 있어요! 꾸준한 묵상으로 믿음의 뿌리를 내려보세요.',
    close: '깊은 묵상과 풍부한 경험을 가지고 계시네요. 더 깊은 내면의 여정으로 나아갈 때입니다.',
    centered: '그리스도 중심의 성숙한 신앙을 가지고 계시네요. 받은 은혜를 나누는 여정을 시작해보세요.',
  };

  // Match selected topics to curricula
  const firstTopic = selectedTopics[0] || '불안';
  const found = findCurriculum(firstTopic);
  let previewDays = [];
  let planTitle = firstTopic;

  if (found && found.type === 'original') {
    previewDays = (found.data.plans?.['30day'] || found.data.plans?.['7day'] || []).slice(0, 5);
    planTitle = found.data.topic;
  } else if (found && found.type === 'extended') {
    previewDays = (found.data.days || []).slice(0, 5);
    planTitle = found.data.topic;
  }

  // Topic queue HTML
  const queueHtml = selectedTopics.length > 1 ? `
    <div style="margin-top:16px;padding:14px;background:var(--primary-bg);border-radius:12px;">
      <div style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;">나의 묵상 여정</div>
      ${selectedTopics.map((t, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;${i > 0 ? 'opacity:0.5;' : ''}">
          <span style="background:${i === 0 ? 'var(--primary)' : 'var(--border)'};color:${i === 0 ? 'white' : 'var(--text-light)'};border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">${i + 1}</span>
          <span style="font-size:14px;${i === 0 ? 'font-weight:600;' : ''}">${t}</span>
          ${i === 0 ? '<span style="font-size:11px;color:var(--primary);font-weight:600;margin-left:auto;">시작</span>' : ''}
        </div>
      `).join('')}
    </div>
  ` : '';

  c.innerHTML = `
    <div class="result-card">
      <div class="result-badge">${icon(levelIcons[level.name_en])}</div>
      <div class="result-level">${level.name} 단계</div>
      <div class="result-title">${level.label}</div>
      <div class="result-desc">${levelDescs[level.name_en]}</div>
    </div>
    <div class="plan-preview">
      <h3>첫 번째 묵상 플랜</h3>
      <p style="font-size:14px;color:var(--text-light);margin-bottom:16px;">
        "${planTitle}" · ${found ? '30' : previewDays.length}일 플랜
      </p>
      ${previewDays.map(d => `
        <div class="plan-day">
          <div class="plan-day-num">Day ${d.day}</div>
          <div>
            <div class="plan-day-passage">${d.passage}</div>
            <div class="plan-day-focus">${d.focus}</div>
          </div>
        </div>
      `).join('')}
      ${queueHtml}
    </div>
    <button class="btn-start" onclick="startPlan()">묵상 여정 시작하기</button>
  `;
}

// ============================================================
// Interactions
// ============================================================
function selectAnswer(qId, choiceId, score) {
  answers[qId] = { id: choiceId, score };
  // Show selected state, then slide out and advance
  render();
  if (currentStep < 12) {
    const card = document.querySelector('.question-card');
    if (card) {
      card.style.animation = 'slideOut 0.3s ease forwards';
      card.addEventListener('animationend', () => {
        currentStep++;
        render();
        window.scrollTo(0, 0);
      }, { once: true });
    }
  }
}
function toggleTopic(topic) {
  const idx = selectedTopics.indexOf(topic);
  if (idx >= 0) selectedTopics.splice(idx, 1);
  else selectedTopics.push(topic);
  render();
}
function setAmount(val) { dailyAmount = val; render(); }
function setParallel(val) { parallelReading = val; render(); }

function nextStep() {
  if (currentStep < 12 && !answers[quizData.questions[currentStep].id]) return;
  if (currentStep === 12 && selectedTopics.length === 0) return;
  currentStep++;
  render();
  window.scrollTo(0, 0);
}
function prevStep() {
  if (currentStep > 0) { currentStep--; render(); window.scrollTo(0, 0); }
}

async function finishOnboarding() {
  const totalScore = Object.values(answers).reduce((s, a) => s + (a.score || 0), 0);
  const level = quizData.scoring.levels.find(l => totalScore >= l.min && totalScore <= l.max)
    || quizData.scoring.levels[0];
  const motivation = answers[1]?.id || 'a';

  await fetch('/api/onboarding', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      maturityLevel: level.name_en,
      totalScore,
      motivation,
      selectedTopics,
      dailyAmount,
      parallelReading,
    }),
  });
  currentStep = 14;
  render();
  window.scrollTo(0, 0);
}

async function startPlan() {
  try {
    const firstTopic = selectedTopics[0] || '불안';
    const found = findCurriculum(firstTopic);

    let planName, topic, duration, planData;

    if (found && found.type === 'original') {
      planData = found.data.plans['30day'] || found.data.plans['14day'] || found.data.plans['7day'] || [];
      planName = found.data.topic;
      topic = found.data.topic;
      duration = planData.length;
    } else if (found && found.type === 'extended') {
      planData = found.data.days || [];
      planName = found.data.topic;
      topic = found.data.topic;
      duration = planData.length;
    }

    if (planData && planData.length > 0) {
      await fetch('/api/custom-plans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ planName, topic, duration, planData }),
      });
    }
  } catch (e) { console.error('startPlan error:', e); }
  window.location.href = '/';
}

// ============================================================
// Start
// ============================================================
init();
</script>
</body>
</html>
