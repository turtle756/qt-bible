<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QT Bible - 성경 3개국어 비교</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --text-primary: #2d2417;
      --text-secondary: #6b5d4d;
      --accent: #8b6914;
      --accent-light: #f5eddb;
      --border: #e8e0d4;
      --verse-hover: #fdf8ee;
    }
    [data-theme="dark"] {
      --bg-primary: #1a1612;
      --bg-card: #242018;
      --text-primary: #e8dcc8;
      --text-secondary: #a69880;
      --accent: #d4a843;
      --accent-light: #2e2818;
      --border: #3a3228;
      --verse-hover: #2a2418;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }
    .serif { font-family: 'Noto Serif', serif; }

    /* Header */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Selectors */
    .selector-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, .nav-btn {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    select:focus, .nav-btn:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .nav-btn {
      padding: 6px 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--accent-light); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Theme toggle */
    .theme-toggle {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
    }

    /* Main content */
    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px;
    }
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .columns { grid-template-columns: 1fr; }
    }

    /* Column */
    .column {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .column-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      background: var(--accent-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .column-header .lang-label {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-secondary);
    }
    .column-body {
      padding: 16px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    /* Verses */
    .verse {
      display: flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      line-height: 1.75;
      margin-bottom: 2px;
    }
    .verse:hover { background: var(--verse-hover); }
    .verse.highlighted {
      background: var(--accent-light);
      border-left: 3px solid var(--accent);
      padding-left: 5px;
    }
    .verse-num {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      min-width: 24px;
      padding-top: 3px;
      text-align: right;
      flex-shrink: 0;
    }
    .verse-text {
      font-size: 0.95rem;
      color: var(--text-primary);
    }
    .verse-text.original {
      font-size: 1.05rem;
      direction: inherit;
      unicode-bidi: embed;
    }
    .verse-text.hebrew {
      direction: rtl;
      font-size: 1.1rem;
      line-height: 2;
    }

    /* Loading & error */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center;
      padding: 40px;
      color: #c0392b;
      font-size: 0.9rem;
    }

    /* QT Notes section */
    .qt-section {
      max-width: 1600px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .qt-notes {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .qt-notes h3 {
      color: var(--accent);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .qt-notes textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem;
      color: var(--text-primary);
      resize: vertical;
      line-height: 1.7;
    }
    .qt-notes textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .qt-notes-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      justify-content: flex-end;
    }
    .qt-notes-actions button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .qt-notes-actions button:hover { opacity: 0.9; }

    /* Book selector modal */
    .book-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .book-modal.open { display: flex; }
    .book-modal-content {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      max-width: 680px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .book-modal-content h3 {
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
    }
    .book-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      color: var(--text-primary);
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.15s;
    }
    .book-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
    }
    .book-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Scrollbar */
    .column-body::-webkit-scrollbar { width: 6px; }
    .column-body::-webkit-scrollbar-track { background: transparent; }
    .column-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Verse sync highlight */
    .verse.synced {
      background: var(--accent-light);
      transition: background 0.2s;
    }

    /* Keyboard shortcut hints */
    .shortcuts-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 8px;
    }
    .shortcuts-hint kbd {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.7rem;
    }

    /* User profile */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }
    .user-name {
      font-size: 0.8rem;
      color: var(--text-secondary);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .logout-btn:hover { background: var(--accent-light); }
    .save-status {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-right: 8px;
    }
  </style>
</head>
<body>

        <div class="column-body" id="origColumn">
          <div class="loading"><div class="spinner"></div><br>Loading...</div>

      <div class="qt-notes-actions">
        <button onclick="saveNotes()">저장</button>
      </div>
    </div>
    <div class="shortcuts-hint">
      <kbd>←</kbd> <kbd>→</kbd> 이전/다음 장 &nbsp; <kbd>B</kbd> 성경 선택

    // ============================================================
    // State
    // ============================================================
    let state = {
      bookId: 1,
      chapter: 1,
      highlightedVerse: null,
    };

    // ============================================================
    // API Layer — bolls.life (free, CORS-friendly, multi-language)
    // ============================================================
    const API_BASE = 'https://bolls.life';

    // Translation codes for bolls.life
    const TRANSLATIONS = {
      korean: 'KRV',     // 개역한글
      kjv: 'KJV',        // King James
      web: 'WEB',        // World English Bible
      hebrew: 'WLC',     // Westminster Leningrad Codex (Hebrew OT)
      greek: 'TISCH',    // Tischendorf Greek NT
    };

    async function fetchChapter(translationCode, bookId, chapter) {
      const url = `${API_BASE}/get-chapter/${translationCode}/${bookId}/${chapter}/`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return data; // Array of { pk, verse, text, ... }
      } catch (err) {
        console.error(`Failed to fetch ${translationCode} ${bookId}:${chapter}`, err);
        return null;
      }
    }

    // ============================================================
    // Rendering
    // ============================================================
    function getBook() {
      return BOOKS.find(b => b.id === state.bookId);
    }

    function renderVerses(containerId, verses, lang) {
      const container = document.getElementById(containerId);
      if (!verses) {
        container.innerHTML = `<div class="error-msg">텍스트를 불러올 수 없습니다.<br>인터넷 연결을 확인해주세요.</div>`;
        return;
      }
      if (verses.length === 0) {
        container.innerHTML = `<div class="error-msg">해당 장의 데이터가 없습니다.</div>`;
        return;
      }

      const book = getBook();
      const isHebrew = lang === 'original' && book.testament === 'OT';

      container.innerHTML = verses.map(v => {
        const textClass = lang === 'original'
          ? (isHebrew ? 'verse-text original hebrew' : 'verse-text original')
          : 'verse-text';
        return `
          <div class="verse" data-verse="${v.verse}" onclick="highlightVerse(${v.verse})">
            <span class="verse-num">${v.verse}</span>
            <span class="${textClass}">${v.text}</span>
          </div>`;
      }).join('');
    }

    function highlightVerse(verseNum) {
      // Remove previous highlights
      document.querySelectorAll('.verse.synced').forEach(el => el.classList.remove('synced'));
      // Add highlight to all columns for this verse
      document.querySelectorAll(`.verse[data-verse="${verseNum}"]`).forEach(el => {
        el.classList.add('synced');
        // Scroll into view in each column
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      state.highlightedVerse = verseNum;
    }

    // ============================================================
    // Load Chapter
    // ============================================================
    async function loadChapter() {
      const book = getBook();
      const ch = state.chapter;

      // Update UI
      document.getElementById('currentBookName').textContent = `${book.ko} ${ch}장`;

      // Update chapter selector
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '';
      for (let i = 1; i <= book.chapters; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}장`;
        if (i === ch) opt.selected = true;
        chapterSelect.appendChild(opt);
      }

      // Update nav buttons
      document.getElementById('prevChapter').disabled = (state.bookId === 1 && ch === 1);
      document.getElementById('nextChapter').disabled = (state.bookId === 66 && ch === book.chapters);

      // Update original language header
      const isOT = book.testament === 'OT';
      document.getElementById('origLangTitle').textContent = isOT ? '히브리어' : '그리스어';
      document.getElementById('origLabel').textContent = isOT ? 'WLC (Hebrew)' : 'Tischendorf (Greek)';

      // Show loading
      ['korColumn', 'engColumn', 'origColumn'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="loading"><div class="spinner"></div><br>불러오는 중...</div>';
      });

      // Determine translations
      const korCode = TRANSLATIONS.korean;
      const engCode = TRANSLATIONS[document.getElementById('engVersion').value] || TRANSLATIONS.kjv;
      const origCode = isOT ? TRANSLATIONS.hebrew : TRANSLATIONS.greek;

      // Fetch all three in parallel
      const [korData, engData, origData] = await Promise.all([
        fetchChapter(korCode, book.id, ch),
        fetchChapter(engCode, book.id, ch),
        fetchChapter(origCode, book.id, ch),
      ]);

      renderVerses('korColumn', korData, 'korean');
      renderVerses('engColumn', engData, 'english');
      renderVerses('origColumn', origData, 'original');

      // Save state to URL
      history.replaceState(null, '', `?book=${state.bookId}&ch=${state.chapter}`);

      // Sync scroll across columns
      setupScrollSync();
    }

    // ============================================================
    // Scroll Sync
    // ============================================================
    function setupScrollSync() {
      const columns = ['korColumn', 'engColumn', 'origColumn'].map(id => document.getElementById(id));
      let isSyncing = false;

      columns.forEach(col => {
        col.addEventListener('scroll', () => {
          if (isSyncing) return;
          isSyncing = true;
          const ratio = col.scrollTop / (col.scrollHeight - col.clientHeight || 1);
          columns.forEach(other => {
            if (other !== col) {
              other.scrollTop = ratio * (other.scrollHeight - other.clientHeight);
            }
          });
          requestAnimationFrame(() => { isSyncing = false; });
        });
      });
    }

    // ============================================================
    // Navigation
    // ============================================================
    function goToBook(bookId, chapter = 1) {
      state.bookId = bookId;
      state.chapter = chapter;
      closeBookModal();
      loadChapter();
    }

    function prevChapter() {
      const book = getBook();
      if (state.chapter > 1) {
        state.chapter--;
      } else {
        // Go to previous book's last chapter
        const prevBook = BOOKS.find(b => b.id === state.bookId - 1);
        if (prevBook) {
          state.bookId = prevBook.id;
          state.chapter = prevBook.chapters;
        }
      }
      loadChapter();
    }

    function nextChapter() {
      const book = getBook();
      if (state.chapter < book.chapters) {
        state.chapter++;
      } else {
        // Go to next book's first chapter
        const nextBook = BOOKS.find(b => b.id === state.bookId + 1);
        if (nextBook) {
          state.bookId = nextBook.id;
          state.chapter = 1;
        }
      }
      loadChapter();
    }

    // ============================================================
    // Book Modal
    // ============================================================
    function openBookModal() {
      const modal = document.getElementById('bookModal');
      const otGrid = document.getElementById('otBooks');
      const ntGrid = document.getElementById('ntBooks');

      otGrid.innerHTML = BOOKS.filter(b => b.testament === 'OT').map(b =>
        `<button class="book-btn ${b.id === state.bookId ? 'active' : ''}"
                 onclick="goToBook(${b.id})">${b.ko}</button>`
      ).join('');

      ntGrid.innerHTML = BOOKS.filter(b => b.testament === 'NT').map(b =>
        `<button class="book-btn ${b.id === state.bookId ? 'active' : ''}"
                 onclick="goToBook(${b.id})">${b.ko}</button>`
      ).join('');

      modal.classList.add('open');
    }

    function closeBookModal() {
      document.getElementById('bookModal').classList.remove('open');
    }

    // ============================================================
    // Auth
    // ============================================================
    let currentUser = null;

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.loggedIn) {
          currentUser = data.user;
          renderUserProfile();
        }
      } catch (err) {
        // Not logged in or server not available — guest mode
      }
    }

    function renderUserProfile() {
      const authArea = document.getElementById('authArea');
      if (currentUser) {
        authArea.innerHTML = `
          <div class="user-profile">
            <img class="user-avatar" src="${currentUser.avatar || ''}" alt="" referrerpolicy="no-referrer">
            <span class="user-name">${currentUser.name}</span>
            <a href="/auth/logout" class="logout-btn">로그아웃</a>
          </div>`;
      }
    }

    // ============================================================
    // QT Notes (localStorage fallback + server sync)
    // ============================================================
    function getNotesKey() {
      return `qt-notes-${state.bookId}-${state.chapter}-${new Date().toISOString().slice(0, 10)}`;
    }

    function getTodayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    async function loadNotes() {
      const textarea = document.getElementById('qtNotesArea');
      if (currentUser) {
        try {
          const res = await fetch(`/api/notes/${state.bookId}/${state.chapter}/${getTodayStr()}`);
          const note = await res.json();
          textarea.value = note?.content || '';
          return;
        } catch (err) { /* fall through to localStorage */ }
      }
      const saved = localStorage.getItem(getNotesKey());
      textarea.value = saved || '';
    }

    async function saveNotes() {
      const text = document.getElementById('qtNotesArea').value;
      const btn = document.querySelector('.qt-notes-actions button');

      // Always save to localStorage as backup
      localStorage.setItem(getNotesKey(), text);

      if (currentUser) {
        try {
          btn.textContent = '저장 중...';
          await fetch('/api/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bookId: state.bookId,
              chapter: state.chapter,
              date: getTodayStr(),
              content: text,
            }),
          });
          btn.textContent = '클라우드 저장됨!';
        } catch (err) {
          btn.textContent = '로컬 저장됨';
        }
      } else {
        btn.textContent = '저장됨!';
      }
      setTimeout(() => { btn.textContent = '저장'; }, 1500);
    }

    // ============================================================
    // Theme
    // ============================================================
    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('qt-theme', isDark ? 'light' : 'dark');
    }

    // ============================================================
    // Keyboard Shortcuts
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { prevChapter(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { nextChapter(); e.preventDefault(); }
      if (e.key === 'b' || e.key === 'B') { openBookModal(); e.preventDefault(); }
      if (e.key === 'Escape') { closeBookModal(); }
    });

    // ============================================================
    // Event Listeners
    // ============================================================
    document.getElementById('bookSelectorBtn').addEventListener('click', openBookModal);
    document.getElementById('bookModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('bookModal')) closeBookModal();
    });
    document.getElementById('chapterSelect').addEventListener('change', (e) => {
      state.chapter = parseInt(e.target.value);
      loadChapter();
    });
    document.getElementById('prevChapter').addEventListener('click', prevChapter);
    document.getElementById('nextChapter').addEventListener('click', nextChapter);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('engVersion').addEventListener('change', loadChapter);

    // ============================================================
    // Init
    // ============================================================
    (function init() {
      // Set date
      const today = new Date();
      document.getElementById('qtDate').textContent =
        `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

      // Restore theme
      const savedTheme = localStorage.getItem('qt-theme');
      if (savedTheme === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').textContent = '☀️';
      }

      // Parse URL params
      const params = new URLSearchParams(window.location.search);
      if (params.get('book')) state.bookId = parseInt(params.get('book'));
      if (params.get('ch')) state.chapter = parseInt(params.get('ch'));

      // Load
      checkAuth().then(() => {
        loadChapter();
        loadNotes();
      });
    })();
  </script>
</body>
</html>
