<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQT - 3개국어 성경 비교 QT</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --text-primary: #2d2417;
      --text-secondary: #6b5d4d;
      --accent: #8b6914;
      --accent-light: #f5eddb;
      --border: #e8e0d4;
      --verse-hover: #fdf8ee;
      --highlight-yellow: rgba(255,235,59,0.3);
      --highlight-green: rgba(129,199,132,0.3);
      --highlight-blue: rgba(100,181,246,0.3);
      --highlight-pink: rgba(240,98,146,0.25);
    }
    [data-theme="dark"] {
      --bg-primary: #1a1612;
      --bg-card: #242018;
      --text-primary: #e8dcc8;
      --text-secondary: #a69880;
      --accent: #d4a843;
      --accent-light: #2e2818;
      --border: #3a3228;
      --verse-hover: #2a2418;
      --highlight-yellow: rgba(255,235,59,0.15);
      --highlight-green: rgba(129,199,132,0.15);
      --highlight-blue: rgba(100,181,246,0.15);
      --highlight-pink: rgba(240,98,146,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo { font-size: 1.15rem; font-weight: 700; color: var(--accent); white-space: nowrap; cursor: pointer; }
    .selector-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    select, .nav-btn {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .nav-btn { font-weight: 500; transition: background 0.15s; }
    .nav-btn:hover { background: var(--accent-light); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--accent-light); }
    .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* User profile */
    .user-profile { display: flex; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); }
    .user-menu {
      display: none;
      position: absolute;
      top: 36px;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 0;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 200;
    }
    .user-menu.open { display: block; }
    .user-menu-item {
      display: block;
      width: 100%;
      padding: 8px 16px;
      border: none;
      background: none;
      text-align: left;
      font-size: 0.85rem;
      color: var(--text-primary);
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .user-menu-item:hover { background: var(--accent-light); }
    .user-menu-item.danger { color: #c0392b; }
    .user-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
    .user-menu-header { padding: 8px 16px; font-size: 0.8rem; color: var(--text-secondary); }

    /* Main content */
    .main { max-width: 1600px; margin: 0 auto; padding: 12px; }
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 1024px) { .columns { grid-template-columns: 1fr; } }

    /* Column */
    .column {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .column-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .column-header .lang-label { font-size: 0.7rem; font-weight: 400; color: var(--text-secondary); }
    .column-body {
      padding: 12px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }

    /* Verses */
    .verse {
      display: flex;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      line-height: 1.75;
      margin-bottom: 2px;
    }
    .verse:hover { background: var(--verse-hover); }
    .verse.synced { background: var(--accent-light); border-left: 3px solid var(--accent); padding-left: 5px; }
    .verse.hl-yellow { background: var(--highlight-yellow); }
    .verse.hl-green { background: var(--highlight-green); }
    .verse.hl-blue { background: var(--highlight-blue); }
    .verse.hl-pink { background: var(--highlight-pink); }
    .verse-num {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.7rem;
      min-width: 22px;
      padding-top: 3px;
      text-align: right;
      flex-shrink: 0;
    }
    .verse-text { font-size: 0.9rem; color: var(--text-primary); }
    .verse-text.original { font-size: 1rem; }
    .verse-text.hebrew { direction: rtl; font-size: 1.05rem; line-height: 2; }

    /* Strong's clickable words */
    .strongs-word {
      cursor: pointer;
      border-bottom: 1px dotted var(--accent);
      transition: background 0.15s;
    }
    .strongs-word:hover {
      background: var(--accent-light);
      border-bottom-style: solid;
    }

    /* Strong's popup */
    .strongs-popup {
      display: none;
      position: fixed;
      z-index: 300;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-width: 360px;
      min-width: 260px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .strongs-popup.open { display: block; }
    .strongs-popup-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; font-size: 1rem;
      cursor: pointer; color: var(--text-secondary);
    }
    .strongs-num {
      font-size: 0.7rem;
      color: white;
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .strongs-clicked-word {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .strongs-korean-meaning {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--accent-light);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }
    .strongs-korean-meaning .label {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 2px;
    }
    .strongs-original-section {
      padding: 8px 0;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .strongs-original-section .label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .strongs-lexeme {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .strongs-translit {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 6px;
    }
    .strongs-short {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .strongs-def {
      font-size: 0.8rem;
      color: var(--text-primary);
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }
    .strongs-def i { color: var(--accent); }
    .strongs-loading {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Highlight color picker */
    .hl-picker {
      display: none;
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 150;
      gap: 6px;
    }
    .hl-picker.open { display: flex; }
    .hl-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .hl-dot:hover { transform: scale(1.2); }
    .hl-dot.yellow { background: #ffeb3b; }
    .hl-dot.green { background: #81c784; }
    .hl-dot.blue { background: #64b5f6; }
    .hl-dot.pink { background: #f06292; }
    .hl-dot.clear { background: var(--bg-primary); font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }

    /* Loading & error */
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .loading .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { text-align: center; padding: 40px; color: #c0392b; font-size: 0.85rem; }

    /* Bottom section: SOAP Notes + Calendar side by side */
    .bottom-section {
      max-width: 1600px;
      margin: 16px auto;
      padding: 0 12px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 12px;
    }
    @media (max-width: 900px) { .bottom-section { grid-template-columns: 1fr; } }

    /* SOAP Notes */
    .soap-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .soap-card h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 12px; }
    .soap-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .soap-tab {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .soap-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .soap-textarea {
      width: 100%;
      min-height: 140px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      color: var(--text-primary);
      resize: vertical;
      line-height: 1.7;
    }
    .soap-textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .soap-actions {
      display: flex; gap: 8px; margin-top: 10px; justify-content: space-between; align-items: center;
    }
    .soap-actions .save-btn {
      background: var(--accent); color: white; border: none;
      padding: 8px 24px; border-radius: 6px; font-size: 0.85rem;
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .soap-actions .save-btn:hover { opacity: 0.9; }
    .soap-actions .status { font-size: 0.75rem; color: var(--text-secondary); }
    .soap-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    /* Calendar */
    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .calendar-card h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 12px; text-align: center; }
    .calendar-nav {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .calendar-nav button {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 1.1rem; padding: 4px 8px;
    }
    .calendar-nav span { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .calendar-day-header {
      font-size: 0.7rem;
      color: var(--text-secondary);
      padding: 4px 0;
      font-weight: 600;
    }
    .calendar-day {
      padding: 6px 2px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: default;
      color: var(--text-secondary);
    }
    .calendar-day.has-qt {
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .calendar-day.today {
      border: 2px solid var(--accent);
      font-weight: 600;
      color: var(--text-primary);
    }
    .calendar-day.empty { visibility: hidden; }
    .calendar-streak {
      text-align: center;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* Book selector modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--bg-card); border-radius: 16px; padding: 24px;
      max-width: 680px; width: 90%; max-height: 80vh; overflow-y: auto;
    }
    .modal-content h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 10px; }
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 5px; }
    .book-btn {
      background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 4px; font-size: 0.75rem; cursor: pointer; text-align: center;
      color: var(--text-primary); font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s;
    }
    .book-btn:hover { background: var(--accent-light); border-color: var(--accent); }
    .book-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Confirm modal */
    .confirm-modal { text-align: center; padding: 20px; max-width: 400px; }
    .confirm-modal p { margin: 16px 0; font-size: 0.9rem; line-height: 1.6; color: var(--text-primary); }
    .confirm-modal .warning { color: #c0392b; font-weight: 600; }
    .confirm-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .confirm-btns button {
      padding: 10px 24px; border-radius: 8px; font-size: 0.85rem;
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif; border: none;
    }
    .btn-cancel { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border) !important; }
    .btn-danger { background: #c0392b; color: white; }

    /* Scrollbar */
    .column-body::-webkit-scrollbar { width: 5px; }
    .column-body::-webkit-scrollbar-track { background: transparent; }
    .column-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Shortcuts */
    .shortcuts-hint {
      font-size: 0.7rem; color: var(--text-secondary); text-align: center; padding: 8px;
    }
    .shortcuts-hint kbd {
      background: var(--bg-primary); border: 1px solid var(--border);
      padding: 1px 4px; border-radius: 3px; font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo" onclick="location.reload()">DailyQT</div>
      <div class="selector-group">
        <button class="nav-btn" id="bookSelectorBtn"><span id="currentBookName">창세기 1장</span></button>
        <select id="chapterSelect"></select>
        <button class="nav-btn" id="prevChapter">&#9664;</button>
        <button class="nav-btn" id="nextChapter">&#9654;</button>
      </div>
      <div class="selector-group">
        <select id="engVersion" title="영어 번역">
          <option value="kjv">KJV</option>
          <option value="web">WEB</option>
        </select>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" title="다크모드">&#127769;</button>
        <div class="user-profile" id="userProfile">
          <img class="user-avatar" id="userAvatar" src="" alt="" referrerpolicy="no-referrer">
          <div class="user-menu" id="userMenu">
            <div class="user-menu-header" id="userMenuName"></div>
            <div class="user-menu-divider"></div>
            <button class="user-menu-item" onclick="location.href='/auth/logout'">로그아웃</button>
            <div class="user-menu-divider"></div>
            <button class="user-menu-item danger" onclick="showDeleteConfirm()">계정 삭제</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Book Selector Modal -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal-content">
      <h3>구약성경</h3>
      <div class="book-grid" id="otBooks"></div>
      <h3 style="margin-top:14px;">신약성경</h3>
      <div class="book-grid" id="ntBooks"></div>
    </div>
  </div>

  <!-- Delete Account Confirm Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content confirm-modal">
      <h3>계정 삭제</h3>
      <p>정말 계정을 삭제하시겠습니까?</p>
      <p class="warning">모든 묵상 노트, 하이라이팅, QT 기록이 영구 삭제됩니다.<br>이 작업은 되돌릴 수 없습니다.</p>
      <div class="confirm-btns">
        <button class="btn-cancel" onclick="closeDeleteModal()">취소</button>
        <button class="btn-danger" onclick="deleteAccount()">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- Highlight color picker (floating) -->
  <div class="hl-picker" id="hlPicker">
    <div class="hl-dot yellow" onclick="applyHighlight('yellow')"></div>
    <div class="hl-dot green" onclick="applyHighlight('green')"></div>
    <div class="hl-dot blue" onclick="applyHighlight('blue')"></div>
    <div class="hl-dot pink" onclick="applyHighlight('pink')"></div>
    <div class="hl-dot clear" onclick="applyHighlight(null)">X</div>
  </div>

  <!-- Strong's Popup -->
  <div class="strongs-popup" id="strongsPopup">
    <button class="strongs-popup-close" onclick="closeStrongsPopup()">&times;</button>
    <div id="strongsContent">
      <div class="strongs-loading">불러오는 중...</div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main">
    <div class="columns">
      <div class="column">
        <div class="column-header"><span>한국어</span><span class="lang-label">개역한글</span></div>
        <div class="column-body" id="korColumn"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
      </div>
      <div class="column">
        <div class="column-header"><span>English</span><span class="lang-label" id="engLabel">KJV</span></div>
        <div class="column-body" id="engColumn"><div class="loading"><div class="spinner"></div><br>Loading...</div></div>
      </div>
      <div class="column">
        <div class="column-header"><span id="origLangTitle">원어</span><span class="lang-label" id="origLabel">Hebrew / Greek</span></div>
        <div class="column-body" id="origColumn"><div class="loading"><div class="spinner"></div><br>Loading...</div></div>
      </div>
    </div>
  </main>

  <!-- Bottom: SOAP Notes + Calendar -->
  <section class="bottom-section">
    <!-- SOAP Notes -->
    <div class="soap-card">
      <h3>SOAP 묵상 노트 — <span id="qtDate"></span></h3>
      <div class="soap-tabs">
        <button class="soap-tab active" data-tab="S" onclick="switchSoapTab('S')">S 말씀</button>
        <button class="soap-tab" data-tab="O" onclick="switchSoapTab('O')">O 관찰</button>
        <button class="soap-tab" data-tab="A" onclick="switchSoapTab('A')">A 적용</button>
        <button class="soap-tab" data-tab="P" onclick="switchSoapTab('P')">P 기도</button>
      </div>
      <div class="soap-hint" id="soapHint">오늘 읽은 본문에서 마음에 와닿는 구절을 기록하세요.</div>
      <textarea class="soap-textarea" id="soapArea" placeholder="여기에 기록하세요..."></textarea>
      <div class="soap-actions">
        <span class="status" id="saveStatus"></span>
        <button class="save-btn" onclick="saveNotes()">저장</button>
      </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-card">
      <h3>QT 캘린더</h3>
      <div class="calendar-nav">
        <button onclick="changeCalMonth(-1)">&#9664;</button>
        <span id="calMonthLabel"></span>
        <button onclick="changeCalMonth(1)">&#9654;</button>
      </div>

    // Clean text: strip HTML tags and Strong's numbers (for Korean/original columns)
    function cleanText(text) {
      const tmp = document.createElement('div');
      tmp.innerHTML = text;
      let clean = tmp.textContent || tmp.innerText || '';
      clean = clean.replace(/(\D)(\d{2,5})\b/g, '$1');
      clean = clean.replace(/\s\d{2,5}(?=\s)/g, '');
      return clean.trim();
    }

    // Parse text with <S> tags into clickable Strong's words
    function parseStrongsText(text, lang) {
      const book = getBook();
      const prefix = book.t === 'OT' ? 'H' : 'G';
      let result = text;
      // word<S>num</S> → clickable span with word displayed
      result = result.replace(/([^<>\s]+)<S>(\d+)<\/S>/gi, (match, word, num) => {
        const escaped = word.replace(/'/g, "\\'");
        return `<span class="strongs-word" onclick="showStrongs(event,'${prefix}${num}','${escaped}','${lang}')" title="${prefix}${num}">${word}</span>`;
      });
      // standalone <S>num</S> → remove
      result = result.replace(/<S>(\d+)<\/S>/gi, '');
      // clean other HTML tags except our spans
      result = result.replace(/<(?!\/?span)[^>]+>/gi, '');
      return result;
    }

    function getKoreanMeaning(englishWord, shortDef) {
      // Try exact match first
      const lower = (englishWord || '').toLowerCase().replace(/[^a-z]/g, '');
      if (KO_DICT[lower]) return KO_DICT[lower];
      // Try short definition words
      if (shortDef) {
        const words = shortDef.toLowerCase().split(/[\s,;]+/);
        for (const w of words) {
          const clean = w.replace(/[^a-z]/g, '');
          if (KO_DICT[clean]) return KO_DICT[clean];
        }
      }
      return null;
    }

    // ============================================================
    // Strong's Popup
    // ============================================================
    const strongsCache = {};

    async function showStrongs(e, strongsNum, clickedWord, fromLang) {
      e.stopPropagation();
      const popup = document.getElementById('strongsPopup');
      const content = document.getElementById('strongsContent');

      const x = Math.min(e.clientX, window.innerWidth - 380);
      const y = Math.min(e.clientY + 10, window.innerHeight - 350);
      popup.style.left = x + 'px';
      popup.style.top = y + 'px';
      popup.classList.add('open');

      content.innerHTML = '<div class="strongs-loading">불러오는 중...</div>';

      if (strongsCache[strongsNum]) {
        renderStrongsPopup(strongsCache[strongsNum], strongsNum, clickedWord, fromLang);
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/dictionary-definition/BDBT/${strongsNum}/`);
        const data = await res.json();
        if (data && data.length > 0) {
          strongsCache[strongsNum] = data[0];
          renderStrongsPopup(data[0], strongsNum, clickedWord, fromLang);
        } else {
          content.innerHTML = `<div class="strongs-loading">${strongsNum} 정보를 찾을 수 없습니다.</div>`;
        }
      } catch (err) {
        content.innerHTML = '<div class="strongs-loading">불러오기 실패</div>';
      }
    }

    function renderStrongsPopup(entry, strongsNum, clickedWord, fromLang) {
      const content = document.getElementById('strongsContent');
      const isHeb = strongsNum.startsWith('H');
      const korMeaning = getKoreanMeaning(clickedWord, entry.short_definition);

      let html = `<span class="strongs-num">${strongsNum}</span>`;

      // Clicked word
      if (clickedWord) {
        html += `<div class="strongs-clicked-word">${clickedWord}</div>`;
      }

      // Korean meaning (the star of the show)
      html += `<div class="strongs-korean-meaning">
        <span class="label">한국어 뜻</span>
        ${korMeaning || entry.short_definition || ''}
      </div>`;

      // Original language section
      if (fromLang === 'english') {
        html += `<div class="strongs-original-section">
          <div class="label">원어 (${isHeb ? '히브리어' : '그리스어'})</div>
          <div class="strongs-lexeme" ${isHeb ? 'style="direction:rtl;"' : ''}>${entry.lexeme || ''}</div>
          <div class="strongs-translit">${entry.transliteration || ''} ${entry.pronunciation ? '(' + entry.pronunciation + ')' : ''}</div>
          <div class="strongs-short">영어 뜻: ${entry.short_definition || ''}</div>
        </div>`;
      } else {
        // From original language column
        html += `<div class="strongs-original-section">
          <div class="label">원어</div>
          <div class="strongs-lexeme" ${isHeb ? 'style="direction:rtl;"' : ''}>${entry.lexeme || ''}</div>
          <div class="strongs-translit">${entry.transliteration || ''} ${entry.pronunciation ? '(' + entry.pronunciation + ')' : ''}</div>
          <div class="strongs-short">영어 뜻: ${entry.short_definition || ''}</div>
        </div>`;
      }

      // Detailed definition (collapsible)
      if (entry.definition) {
        html += `<details style="margin-top:8px;">
          <summary style="font-size:0.75rem;color:var(--text-secondary);cursor:pointer;">상세 정의 보기</summary>
          <div class="strongs-def">${entry.definition}</div>
        </details>`;
      }

      content.innerHTML = html;
    }

    function closeStrongsPopup() {
      document.getElementById('strongsPopup').classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.strongs-popup') && !e.target.closest('.strongs-word')) {

    // ============================================================
    // Render
    // ============================================================
    function getBook() { return BOOKS.find(b => b.id === state.bookId); }

    function renderVerses(containerId, verses, lang) {
      const container = document.getElementById(containerId);
      if (!verses) { container.innerHTML = '<div class="error-msg">텍스트를 불러올 수 없습니다.</div>'; return; }
      if (!verses.length) { container.innerHTML = '<div class="error-msg">데이터가 없습니다.</div>'; return; }
      const book = getBook();
      const isHebrew = lang === 'original' && book.t === 'OT';
      container.innerHTML = verses.map(v => {
        const cls = lang === 'original' ? (isHebrew ? 'verse-text original hebrew' : 'verse-text original') : 'verse-text';
        const hlClass = highlights[v.verse] ? ` hl-${highlights[v.verse]}` : '';
        // English & Original columns: parse Strong's into clickable words
        const textHtml = (lang === 'english' || lang === 'original') ? parseStrongsText(v.text, lang) : cleanText(v.text);
        return `<div class="verse${hlClass}" data-verse="${v.verse}" onclick="onVerseClick(event, ${v.verse})" oncontextmenu="onVerseRightClick(event, ${v.verse})">
          <span class="verse-num">${v.verse}</span>
          <span class="${cls}">${textHtml}</span>
        </div>`;
      }).join('');
    }

    function onVerseClick(e, verseNum) {
      document.querySelectorAll('.verse.synced').forEach(el => el.classList.remove('synced'));
      document.querySelectorAll(`.verse[data-verse="${verseNum}"]`).forEach(el => {
        el.classList.add('synced');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    function onVerseRightClick(e, verseNum) {
      e.preventDefault();
      pickerVerse = verseNum;
      const picker = document.getElementById('hlPicker');
      picker.style.left = e.clientX + 'px';
      picker.style.top = e.clientY + 'px';
      picker.classList.add('open');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.hl-picker')) {
        document.getElementById('hlPicker').classList.remove('open');
      }
    });

    async function applyHighlight(color) {
      document.getElementById('hlPicker').classList.remove('open');
      if (pickerVerse === null) return;
      const verse = pickerVerse;
      if (color) {
        highlights[verse] = color;
        await fetch('/api/highlights', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bookId: state.bookId, chapter: state.chapter, verse, color }),
        });
      } else {
        delete highlights[verse];
        await fetch(`/api/highlights/${state.bookId}/${state.chapter}/${verse}`, { method: 'DELETE' });
      }
      // Update UI
      document.querySelectorAll(`.verse[data-verse="${verse}"]`).forEach(el => {
        el.className = el.className.replace(/\shl-\w+/g, '');
        if (color) el.classList.add(`hl-${color}`);
      });
    }

    // ============================================================
    // Load Chapter
    // ============================================================
    async function loadChapter() {
      const book = getBook();
      const ch = state.chapter;
      document.getElementById('currentBookName').textContent = `${book.ko} ${ch}장`;

      const sel = document.getElementById('chapterSelect');
      sel.innerHTML = '';
      for (let i = 1; i <= book.ch; i++) {
        const o = document.createElement('option');
        o.value = i; o.textContent = `${i}장`;
        if (i === ch) o.selected = true;
        sel.appendChild(o);
      }
      document.getElementById('prevChapter').disabled = (state.bookId === 1 && ch === 1);
      document.getElementById('nextChapter').disabled = (state.bookId === 66 && ch === book.ch);

      const isOT = book.t === 'OT';
      document.getElementById('origLangTitle').textContent = isOT ? '히브리어' : '그리스어';
      document.getElementById('origLabel').textContent = isOT ? 'WLC (Hebrew)' : 'Tischendorf (Greek)';

      ['korColumn','engColumn','origColumn'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="loading"><div class="spinner"></div><br>불러오는 중...</div>';
      });

      const engCode = TR[document.getElementById('engVersion').value] || TR.kjv;
      const origCode = isOT ? TR.hebrew : TR.greek;

      // Load highlights for this chapter
      try {
        const hlRes = await fetch(`/api/highlights/${book.id}/${ch}`);
        const hlData = await hlRes.json();
        highlights = {};
        hlData.forEach(h => { highlights[h.verse] = h.color; });
      } catch (e) { highlights = {}; }

      const [korData, engData, origData] = await Promise.all([
        fetchChapter(TR.korean, book.id, ch),
        fetchChapter(engCode, book.id, ch),
        fetchChapter(origCode, book.id, ch),
      ]);

      renderVerses('korColumn', korData, 'korean');
      renderVerses('engColumn', engData, 'english');
      renderVerses('origColumn', origData, 'original');

      history.replaceState(null, '', `?book=${state.bookId}&ch=${state.chapter}`);
      setupScrollSync();
      loadNotes();

      // Log QT for today
      const today = getTodayStr();
      fetch('/api/qt-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: today, bookId: state.bookId, chapter: state.chapter }),
      }).catch(() => {});
    }

    // ============================================================
    // Scroll Sync
    // ============================================================
    function setupScrollSync() {
      const cols = ['korColumn','engColumn','origColumn'].map(id => document.getElementById(id));
      let syncing = false;
      cols.forEach(col => {
        col.addEventListener('scroll', () => {
          if (syncing) return;
          syncing = true;
          const r = col.scrollTop / (col.scrollHeight - col.clientHeight || 1);
          cols.forEach(o => { if (o !== col) o.scrollTop = r * (o.scrollHeight - o.clientHeight); });
          requestAnimationFrame(() => { syncing = false; });
        });
      });
    }

    // ============================================================
    // Navigation
    // ============================================================
    function goToBook(bookId, chapter = 1) {
      state.bookId = bookId; state.chapter = chapter;
      document.getElementById('bookModal').classList.remove('open');
      loadChapter();
    }
    function prevChapter() {
      const book = getBook();
      if (state.chapter > 1) state.chapter--;
      else { const p = BOOKS.find(b => b.id === state.bookId - 1); if (p) { state.bookId = p.id; state.chapter = p.ch; } }
      loadChapter();
    }
    function nextChapter() {
      const book = getBook();
      if (state.chapter < book.ch) state.chapter++;
      else { const n = BOOKS.find(b => b.id === state.bookId + 1); if (n) { state.bookId = n.id; state.chapter = 1; } }
      loadChapter();
    }
    function openBookModal() {
      const m = document.getElementById('bookModal');
      document.getElementById('otBooks').innerHTML = BOOKS.filter(b=>b.t==='OT').map(b=>
        `<button class="book-btn ${b.id===state.bookId?'active':''}" onclick="goToBook(${b.id})">${b.ko}</button>`).join('');
      document.getElementById('ntBooks').innerHTML = BOOKS.filter(b=>b.t==='NT').map(b=>
        `<button class="book-btn ${b.id===state.bookId?'active':''}" onclick="goToBook(${b.id})">${b.ko}</button>`).join('');
      m.classList.add('open');
    }

    // ============================================================
    // SOAP Notes
    // ============================================================
    function getTodayStr() { return new Date().toISOString().slice(0, 10); }

    function switchSoapTab(tab) {
      // Save current tab content
      soapData[currentSoapTab] = document.getElementById('soapArea').value;
      currentSoapTab = tab;
      document.querySelectorAll('.soap-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('soapArea').value = soapData[tab] || '';
      document.getElementById('soapHint').textContent = SOAP_HINTS[tab];
    }

    async function loadNotes() {
      try {
        const res = await fetch(`/api/notes/${state.bookId}/${state.chapter}/${getTodayStr()}`);
        const note = await res.json();
        if (note && note.content) {
          try {
            const parsed = JSON.parse(note.content);
            soapData = { S: parsed.S || '', O: parsed.O || '', A: parsed.A || '', P: parsed.P || '' };
          } catch (e) {
            soapData = { S: note.content, O: '', A: '', P: '' };
          }
        } else {
          soapData = { S: '', O: '', A: '', P: '' };
        }
      } catch (e) {
        soapData = { S: '', O: '', A: '', P: '' };
      }
      document.getElementById('soapArea').value = soapData[currentSoapTab] || '';
    }

    async function saveNotes() {
      soapData[currentSoapTab] = document.getElementById('soapArea').value;
      const statusEl = document.getElementById('saveStatus');
      try {
        statusEl.textContent = '저장 중...';
        await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bookId: state.bookId,
            chapter: state.chapter,
            date: getTodayStr(),
            content: JSON.stringify(soapData),
          }),
        });
        statusEl.textContent = '저장됨';
      } catch (e) {
        statusEl.textContent = '저장 실패';
      }
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    }

    // ============================================================
    // Calendar
    // ============================================================
    async function renderCalendar() {
      const label = document.getElementById('calMonthLabel');
      label.textContent = `${calYear}년 ${calMonth}월`;

      let qtDates = [];
      try {
        const res = await fetch(`/api/qt-log?year=${calYear}&month=${calMonth}`);
        qtDates = (await res.json()).map(r => new Date(r.log_date).getDate());
      } catch (e) {}

      const grid = document.getElementById('calendarGrid');
      const days = ['일','월','화','수','목','금','토'];
      let html = days.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

      const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth, 0).getDate();
      const today = new Date();
      const isThisMonth = today.getFullYear() === calYear && today.getMonth() + 1 === calMonth;

      for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const hasQt = qtDates.includes(d);
        const isToday = isThisMonth && d === today.getDate();
        let cls = 'calendar-day';
        if (hasQt) cls += ' has-qt';
        if (isToday) cls += ' today';
        html += `<div class="${cls}">${d}</div>`;
      }
      grid.innerHTML = html;

      // Streak
      const streak = qtDates.length;
      document.getElementById('streakInfo').textContent =
        streak > 0 ? `이번 달 ${streak}일 QT 완료` : '이번 달 아직 QT 기록이 없어요';
    }

    function changeCalMonth(delta) {
      calMonth += delta;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      if (calMonth < 1) { calMonth = 12; calYear--; }
      renderCalendar();
    }

    // ============================================================
    // Theme
    // ============================================================
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeToggle').innerHTML = isDark ? '&#127769;' : '&#9728;&#65039;';
      localStorage.setItem('qt-theme', isDark ? 'light' : 'dark');
    }

    // ============================================================
    // Keyboard Shortcuts
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { prevChapter(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { nextChapter(); e.preventDefault(); }
      if (e.key === 'b' || e.key === 'B') { openBookModal(); e.preventDefault(); }
      if (e.key === 'Escape') { document.getElementById('bookModal').classList.remove('open'); }
    });

    // ============================================================
    // Event Listeners
    // ============================================================
    document.getElementById('bookSelectorBtn').addEventListener('click', openBookModal);
    document.getElementById('bookModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('bookModal')) document.getElementById('bookModal').classList.remove('open');
    });
    document.getElementById('deleteModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
    });
    document.getElementById('chapterSelect').addEventListener('change', (e) => {
      state.chapter = parseInt(e.target.value); loadChapter();
    });
    document.getElementById('prevChapter').addEventListener('click', prevChapter);
    document.getElementById('nextChapter').addEventListener('click', nextChapter);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('engVersion').addEventListener('change', loadChapter);

    // ============================================================
    // Init
    // ============================================================
    (async function init() {
      // Theme
      if (localStorage.getItem('qt-theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerHTML = '&#9728;&#65039;';
      }

      // Date
      const today = new Date();
      document.getElementById('qtDate').textContent = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
      calYear = today.getFullYear();
      calMonth = today.getMonth() + 1;

      // URL params
      const params = new URLSearchParams(window.location.search);
      if (params.get('book')) state.bookId = parseInt(params.get('book'));
      if (params.get('ch')) state.chapter = parseInt(params.get('ch'));

      // Auth check (redirects to login if not authenticated)
      const loggedIn = await checkAuth();
      if (!loggedIn) return;

      // Load
      loadChapter();
      renderCalendar();
    })();
  </script>
</body>
